<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="746" viewBox="0 0 1320 746" role="img" aria-labelledby="title desc">
  <title id="title">Manipulation Component Architecture</title>
  <desc id="desc">The command line, YAML point tasks, and Python interface call device sessions through the local manipulation-device process, while C++ applications link the component library and call sessions directly. Device sessions handle device exclusivity, action execution, arrival determination, cancellation, timeouts, and fault latching, and invoke drivers for Nero, SO101, mock, or extensions created according to device.driver. Supporting capabilities on the right provide kinematics, hand-eye calibration, device configuration and robot models, and SO101 servo tools.</desc>
