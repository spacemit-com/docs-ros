<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="844" viewBox="0 0 1320 844" role="img" aria-labelledby="title desc">
  <title id="title">Dice Game System Architecture</title>
  <desc id="desc">The browser accesses the game service, whose backend calls the arm interface, local speech, dice recognition, and video relay. The arm interface sends commands to the cup-grasping application, which uses planning and task state to generate actions and controls the Nero arm and Revo2 hand through the manipulation component. Hand-eye calibration saves extrinsics and table data in the site directory; a download script retrieves runtime assets.</desc>
