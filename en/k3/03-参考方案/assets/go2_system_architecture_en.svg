<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img" aria-labelledby="title description">
  <title id="title">Go2 control and hardware flow</title>
  <desc id="description">Web and optional SBUS inputs send ROS 2 commands to the Go2 controller. The K3 Linux CPU cores run control and ONNX inference, sending joint targets and receiving motor and IMU feedback. Choose a custom carrier with direct UART access or a standard board with USB adapters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52647b" />
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #20334b; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #53667d; }
      .code { font-size: 19px; fill: #385675; }
      .scope { fill: #f7f9fc; stroke: #aebdce; stroke-width: 2; }
      .process { fill: #edf3fb; stroke: #9bb5d5; stroke-width: 1.5; }
      .input { fill: #f0f5fb; stroke: #a4b8d1; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #9bb5d5; stroke-width: 1.5; }
      .policy { fill: #f0edf9; stroke: #b8acd3; stroke-width: 1.5; }
      .hardware { fill: #eef7f4; stroke: #90bdae; stroke-width: 1.5; }
      .edge { fill: none; stroke: #52647b; stroke-width: 2.2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="1060" fill="white" />
  <text class="title" x="640" y="43" text-anchor="middle">Go2 control and hardware flow</text>
  <text class="small" x="640" y="75" text-anchor="middle">Shared control and ONNX inference on the K3 Linux CPU cores</text>

  <rect class="input" x="120" y="100" width="430" height="80" rx="12" />
  <text class="heading" x="335" y="133" text-anchor="middle">Phone / PC web UI · Android client</text>
  <text class="small" x="335" y="162" text-anchor="middle">Mode selection, velocity and status</text>
  <rect class="input" x="750" y="100" width="410" height="80" rx="12" />
  <text class="heading" x="955" y="133" text-anchor="middle">SBUS controller + receiver</text>
  <text class="small" x="955" y="162" text-anchor="middle">Optional · channels and mode switches</text>

  <rect class="scope" x="60" y="215" width="1160" height="550" rx="16" />
  <text class="heading" x="85" y="249">K3 Linux CPU</text>
  <text class="small" x="85" y="278">ROS 2 runtime</text>

  <rect class="node" x="120" y="300" width="430" height="86" rx="10" />
  <text class="heading" x="335" y="334" text-anchor="middle">Web server node</text>
  <text class="code" x="335" y="365" text-anchor="middle">web_teleop_server.py</text>
  <rect class="node" x="750" y="300" width="410" height="86" rx="10" />
  <text class="heading" x="955" y="334" text-anchor="middle">SBUS input node</text>
  <text class="small" x="955" y="365" text-anchor="middle">sbus_teleop_node · rc_receiver</text>

  <rect class="process" x="100" y="450" width="1080" height="300" rx="12" />
  <text class="heading" x="125" y="486">go2_node · C++ control process</text>
  <rect class="node" x="125" y="510" width="520" height="95" rx="10" />
  <text class="body" x="385" y="546" text-anchor="middle">Input arbitration, modes and state checks</text>
  <text class="small" x="385" y="581" text-anchor="middle">Control timer: 1 ms · joint targets</text>
  <rect class="policy" x="835" y="510" width="320" height="95" rx="10" />
  <text class="body" x="995" y="546" text-anchor="middle">RL component · ONNX</text>
  <text class="small" x="995" y="581" text-anchor="middle">Policy timer: 20 ms</text>
  <rect class="node" x="360" y="675" width="560" height="65" rx="10" />
  <text class="body" x="640" y="703" text-anchor="middle">Hardware adaptation and peripheral libraries</text>
  <text class="small" x="640" y="728" text-anchor="middle">Motor and IMU drivers</text>

  <path class="edge both" d="M 335 180 V 300" />
  <text class="small" x="355" y="236">HTTP / WebRTC</text>
  <path class="edge" d="M 955 180 V 300" />
  <text class="small" x="975" y="236">UART</text>
  <path class="edge" d="M 390 386 V 450" />
  <text class="small" x="410" y="426">ROS 2 mode / velocity</text>
  <path class="edge" d="M 240 450 V 386" />
  <text class="small" x="221" y="426" text-anchor="end">Status</text>
  <path class="edge" d="M 955 386 V 416 H 670 V 450" />
  <text class="small" x="795" y="405" text-anchor="middle">ROS 2 mode / velocity</text>
  <path class="edge" d="M 645 537 H 835" />
  <text class="small" x="740" y="527" text-anchor="middle">Observation</text>
  <path class="edge" d="M 835 582 H 645" />
  <text class="small" x="740" y="572" text-anchor="middle">Policy action</text>
  <path class="edge" d="M 480 605 V 675" />
  <text class="small" x="460" y="648" text-anchor="end">Joint targets</text>
  <path class="edge" d="M 600 675 V 605" />
  <text class="small" x="620" y="648">Motor / IMU feedback</text>

  <path class="edge both" d="M 520 740 V 810 H 345 V 855" />
  <path class="edge both" d="M 760 740 V 810 H 935 V 855" />
  <text class="body" x="640" y="842" text-anchor="middle">Select one hardware path with robot.board_profile</text>
  <rect class="hardware" x="95" y="855" width="500" height="180" rx="12" />
  <text class="heading" x="345" y="889" text-anchor="middle">Go2 custom carrier · direct UART</text>
  <text class="code" x="345" y="920" text-anchor="middle">new_bigcore</text>
  <text class="body" x="345" y="962" text-anchor="middle">4 UARTs ↔ RS485 ↔ 12 joint motors</text>
  <text class="body" x="345" y="1000" text-anchor="middle">SPI ↔ onboard BMI270</text>
  <rect class="hardware" x="685" y="855" width="500" height="180" rx="12" />
  <text class="heading" x="935" y="889" text-anchor="middle">Standard K3/CoM260 · USB</text>
  <text class="code" x="935" y="920" text-anchor="middle">legacy_usb</text>
  <text class="body" x="935" y="962" text-anchor="middle">USB ↔ 4 RS485 ports ↔ 12 joint motors</text>
  <text class="body" x="935" y="1000" text-anchor="middle">USB to TTL ↔ external IMU (e.g. IWT603)</text>
</svg>