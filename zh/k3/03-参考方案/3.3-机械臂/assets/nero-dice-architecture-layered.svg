  <!-- Generated by docs/diagrams/architecture.py; edit that source. -->
  <title id="title">Dice Arena 系统架构</title>
  <desc id="desc">浏览器通过 HTTP 访问 dice-arena serve 启动的游戏后端。后端运行游戏状态机，调用机械臂、语音和骰子识别组件；识别视频经 RTSP 送入 MediaMTX，再以 WebRTC 送到浏览器。机械臂接口调用 CupApplication，由应用内的 Nero URDF 运动学与抓杯规划生成轨迹，由 cup_task 检查阶段顺序并锁定故障，动作经 DeviceClient、manipulation-device 的 DeviceSession 和 Nero / Revo2 驱动执行。手眼标定使用公共采集与求解能力，结果和配置保存于 SITE；CupApplication 将需要人工处理的任务状态写入 runtime/task_state.json，跨进程重启保留。</desc>
