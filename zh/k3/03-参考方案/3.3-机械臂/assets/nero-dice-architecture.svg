<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="844" viewBox="0 0 1320 844" role="img" aria-labelledby="title desc">
  <title id="title">摇骰子游戏系统架构</title>
  <desc id="desc">浏览器访问游戏服务；游戏后端调用机械臂接口、本地语音、骰子识别和视频转发。机械臂接口向抓杯应用下发命令，抓杯应用由抓杯规划和任务状态生成动作，经 manipulation 组件控制 Nero 机械臂与 Revo2 灵巧手。手眼标定把外参和桌面写入现场目录；运行资源由下载脚本获取。</desc>
