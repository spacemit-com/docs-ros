<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img" aria-labelledby="title description">
  <title id="title">Go2 控制与硬件接入流程</title>
  <desc id="description">网页与可选 SBUS 遥控器通过 ROS 2 向 Go2 主控输入模式和速度。主控在 K3 大核 Linux 上执行控制与 ONNX 推理，经电机和 IMU 公共组件下发目标、读取反馈。定制底板大核直连和普通开发板 USB 是并列的两种硬件方案。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52647b"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #20334b; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #53667d; }
      .code { font-size: 19px; fill: #385675; }
      .scope { fill: #f7f9fc; stroke: #aebdce; stroke-width: 2; }
      .process { fill: #edf3fb; stroke: #9bb5d5; stroke-width: 1.5; }
      .input { fill: #f0f5fb; stroke: #a4b8d1; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #9bb5d5; stroke-width: 1.5; }
      .policy { fill: #f0edf9; stroke: #b8acd3; stroke-width: 1.5; }
      .hardware { fill: #eef7f4; stroke: #90bdae; stroke-width: 1.5; }
      .edge { fill: none; stroke: #52647b; stroke-width: 2.2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="1060" fill="white"/>
  <text class="title" x="640" y="43" text-anchor="middle">Go2 控制与硬件接入流程</text>
  <text class="small" x="640" y="75" text-anchor="middle">两种硬件方案共用 K3 大核控制与 ONNX 推理</text>

  <rect class="input" x="120" y="100" width="430" height="80" rx="12"/>
  <text class="heading" x="335" y="133" text-anchor="middle">手机 / PC 控制网页、Android 客户端</text>
  <text class="small" x="335" y="162" text-anchor="middle">模式选择、摇杆速度与状态查看</text>
  <rect class="input" x="750" y="100" width="410" height="80" rx="12"/>
  <text class="heading" x="955" y="133" text-anchor="middle">SBUS 遥控器与接收机（可选）</text>
  <text class="small" x="955" y="162" text-anchor="middle">通道输入与模式按键</text>

  <rect class="scope" x="60" y="215" width="1160" height="550" rx="16"/>
  <text class="heading" x="85" y="249">K3 大核 Linux</text>
  <text class="small" x="85" y="278">ROS 2 节点与公共组件</text>

  <rect class="node" x="120" y="300" width="430" height="86" rx="10"/>
  <text class="heading" x="335" y="334" text-anchor="middle">网页服务节点</text>
  <text class="code" x="335" y="365" text-anchor="middle">web_teleop_server.py</text>
  <rect class="node" x="750" y="300" width="410" height="86" rx="10"/>
  <text class="heading" x="955" y="334" text-anchor="middle">SBUS 输入节点</text>
  <text class="small" x="955" y="365" text-anchor="middle">sbus_teleop_node · rc_receiver 组件</text>

  <rect class="process" x="100" y="450" width="1080" height="300" rx="12"/>
  <text class="heading" x="125" y="486">go2_node · C++ 主控进程</text>
  <rect class="node" x="125" y="510" width="520" height="95" rx="10"/>
  <text class="body" x="385" y="546" text-anchor="middle">控制权仲裁、模式切换与状态检查</text>
  <text class="small" x="385" y="581" text-anchor="middle">控制调度周期 1 ms · 计算关节控制目标</text>
  <rect class="policy" x="835" y="510" width="320" height="95" rx="10"/>
  <text class="body" x="995" y="546" text-anchor="middle">RL 公共组件 · ONNX 推理</text>
  <text class="small" x="995" y="581" text-anchor="middle">策略调度周期 20 ms</text>
  <rect class="node" x="360" y="675" width="560" height="65" rx="10"/>
  <text class="body" x="640" y="703" text-anchor="middle">硬件适配与外设公共组件</text>
  <text class="small" x="640" y="728" text-anchor="middle">电机 motor · 惯性传感器 imu</text>

  <path class="edge both" d="M 335 180 V 300"/>
  <text class="small" x="355" y="236">HTTP / WebRTC</text>
  <path class="edge" d="M 955 180 V 300"/>
  <text class="small" x="975" y="236">UART</text>
  <path class="edge" d="M 390 386 V 450"/>
  <text class="small" x="410" y="426">ROS 2 模式 / 速度</text>
  <path class="edge" d="M 240 450 V 386"/>
  <text class="small" x="221" y="426" text-anchor="end">状态</text>
  <path class="edge" d="M 955 386 V 416 H 670 V 450"/>
  <text class="small" x="795" y="405" text-anchor="middle">ROS 2 模式 / 速度</text>
  <path class="edge" d="M 645 537 H 835"/>
  <text class="small" x="740" y="527" text-anchor="middle">策略观测</text>
  <path class="edge" d="M 835 582 H 645"/>
  <text class="small" x="740" y="572" text-anchor="middle">策略动作</text>
  <path class="edge" d="M 480 605 V 675"/>
  <text class="small" x="460" y="648" text-anchor="end">关节目标</text>
  <path class="edge" d="M 600 675 V 605"/>
  <text class="small" x="620" y="648">电机 / IMU 反馈</text>

  <path class="edge both" d="M 520 740 V 810 H 345 V 855"/>
  <path class="edge both" d="M 760 740 V 810 H 935 V 855"/>
  <text class="body" x="640" y="842" text-anchor="middle">按 robot.board_profile 选择一种硬件方案</text>
  <rect class="hardware" x="95" y="855" width="500" height="180" rx="12"/>
  <text class="heading" x="345" y="889" text-anchor="middle">Go2 定制底板大核直连</text>
  <text class="code" x="345" y="920" text-anchor="middle">new_bigcore</text>
  <text class="body" x="345" y="962" text-anchor="middle">四路 UART ↔ RS485 ↔ 12 个关节电机</text>
  <text class="body" x="345" y="1000" text-anchor="middle">SPI ↔ 板载 BMI270</text>
  <rect class="hardware" x="685" y="855" width="500" height="180" rx="12"/>
  <text class="heading" x="935" y="889" text-anchor="middle">普通 K3/CoM260 开发板 USB</text>
  <text class="code" x="935" y="920" text-anchor="middle">legacy_usb</text>
  <text class="body" x="935" y="962" text-anchor="middle">USB ↔ 四路 RS485 ↔ 12 个关节电机</text>
  <text class="body" x="935" y="1000" text-anchor="middle">USB 转 TTL ↔ 外接 IMU（示例 IWT603）</text>
</svg>
