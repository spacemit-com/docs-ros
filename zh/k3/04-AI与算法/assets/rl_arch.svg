<text x="680" y="346" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">对外头文件 include/rl_service.h：LoadPolicyConfigFromYaml 与 PolicyExecutor</text>
<rect x="324" y="370" width="712" height="52" rx="12" fill="#fffaf0" stroke="#c9a45a" stroke-width="1.8"/>
