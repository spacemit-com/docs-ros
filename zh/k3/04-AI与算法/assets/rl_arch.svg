<text x="871" y="536" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">segment_&lt;n&gt;_mode</text>
<text x="742" y="566" font-size="15" font-weight="600" text-anchor="start" fill="#172635">无历史</text>
<text x="1000" y="566" font-size="14" font-weight="400" text-anchor="end" fill="#536779">只取当前帧</text>
<text x="742" y="593" font-size="15" font-weight="600" text-anchor="start" fill="#172635">flat_history</text>
<text x="1000" y="593" font-size="14" font-weight="400" text-anchor="end" fill="#536779">按变量分组</text>
<text x="742" y="620" font-size="15" font-weight="600" text-anchor="start" fill="#172635">frame_history</text>
<text x="1000" y="620" font-size="14" font-weight="400" text-anchor="end" fill="#536779">按帧滑窗</text>
