<text x="1016" y="403" font-size="14" font-weight="400" text-anchor="end" fill="#536779">按策略名加载并校验配置，加载模型</text>
<rect x="324" y="440" width="712" height="216" rx="12" fill="#eff8f2" stroke="#4b9270" stroke-width="1.8"/>
<text x="344" y="473" font-size="20" font-weight="700" text-anchor="start" fill="#172635">① 观测组装</text>
<text x="460.547" y="473" font-size="15" font-weight="500" text-anchor="start" fill="#536779">AssembleObs</text>
<text x="1016" y="473" font-size="14" font-weight="400" text-anchor="end" fill="#536779">各段依次拼接为观测向量</text>
<rect x="340" y="490" width="350" height="150" rx="10" fill="#ffffff" stroke="#8fbfa6" stroke-width="1.5"/>
<text x="515" y="516" font-size="17" font-weight="600" text-anchor="middle" fill="#172635">观测项</text>
<text x="515" y="536" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">segment_&lt;n&gt;_terms</text>
<text x="515" y="562" font-size="15" font-weight="400" text-anchor="middle" fill="#172635">ang_vel, gravity, command</text>
<text x="515" y="584" font-size="15" font-weight="400" text-anchor="middle" fill="#172635">dof_pos, dof_vel, last_action</text>
<text x="515" y="606" font-size="15" font-weight="400" text-anchor="middle" fill="#172635">phase, gait_phase, ref_motion_phase 等</text>
<text x="515" y="628" font-size="15" font-weight="600" text-anchor="middle" fill="#172635">自定义标量、自定义数组</text>
<path d="M690 565 H720" fill="none" stroke="#286fbb" stroke-width="2.4" marker-end="url(#blue)"/>
