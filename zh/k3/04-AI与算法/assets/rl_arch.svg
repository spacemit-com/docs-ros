<rect x="44" y="574" width="202" height="84" rx="10" fill="#ffffff" stroke="#8d9cab" stroke-width="1.5"/>
<text x="145" y="601" font-size="16" font-weight="600" text-anchor="middle" fill="#172635">自定义标量 / 数组</text>
<text x="145" y="623" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">SetCustomScalar</text>
<text x="145" y="643" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">SetCustomArray</text>
<rect x="44" y="854" width="202" height="66" rx="10" fill="#ffffff" stroke="#8d9cab" stroke-width="1.5"/>
<text x="145" y="881" font-size="16" font-weight="600" text-anchor="middle" fill="#172635">external 输入</text>
<text x="145" y="904" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">SetModelInput</text>
