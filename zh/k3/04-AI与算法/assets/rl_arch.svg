<text x="54" y="192" font-size="14" font-weight="400" text-anchor="start" fill="#536779">由机型仓库提供</text>
<rect x="304" y="134" width="400" height="82" rx="10" fill="#ffffff" stroke="#c9a45a" stroke-width="1.5"/>
<text x="504" y="161" font-size="18" font-weight="600" text-anchor="middle" fill="#172635">策略 YAML</text>
<text x="504" y="183" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">rl_policy.onnx_infer.policies.&lt;name&gt;</text>
<text x="504" y="204" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">观测段、model_io、后端与运行参数、动作映射、kp / kd</text>
<text x="722" y="182" font-size="20" font-weight="500" text-anchor="middle" fill="#536779">+</text>
<rect x="740" y="134" width="316" height="82" rx="10" fill="#ffffff" stroke="#c9a45a" stroke-width="1.5"/>
<text x="898" y="161" font-size="18" font-weight="600" text-anchor="middle" fill="#172635">模型文件</text>
<text x="898" y="184" font-size="16" font-weight="400" text-anchor="middle" fill="#172635">.onnx 或 .mnn</text>
<text x="898" y="205" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">路径由 model_path 指定</text>
<text x="1215" y="170" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">同一 YAML 可声明多个策略</text>
<text x="1215" y="192" font-size="14" font-weight="400" text-anchor="middle" fill="#536779">运行时按名称加载和切换</text>
</g>
