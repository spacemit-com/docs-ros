<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1360" height="1306" viewBox="0 0 1360 1306" role="img" aria-labelledby="title desc">
<title id="title">RL 策略推理组件架构</title>
<desc id="desc">策略 YAML 和模型文件由机型仓库提供，同一 YAML 可声明多个策略。初始化时 LoadPolicyConfigFromYaml 按策略名加载并校验配置，返回的 exec_cfg 交给 PolicyExecutor 的 Init 加载模型，kp、kd、command_init 等上层参数由上层应用使用。上层应用每个推理周期写入机器人状态与速度命令、自定义标量或数组以及 external 输入。执行器依次完成三步：观测组装（AssembleObs）按段计算观测项，可带 flat_history 或 frame_history 历史，各段拼接为观测向量；模型推理（Infer）按 model_io 声明的张量名绑定输入来源和输出用途，推理后端为 ONNX Runtime（CPU 或 SpaceMIT EP）或 MNN（CPU），feedback 把输出回灌到下一帧的输入，输出的 action 可选裁剪和平滑；关节映射（MapActionToTargetPos）把 action 缩放并加上默认位置后按 action_joint_index 写入对应关节。上层应用读取关节目标位置和 expose 输出。配套工具包括功能测试、后端测试和性能基准。</desc>
<defs><style>
text { font-family: "Noto Sans CJK SC", "Noto Sans CJK JP", "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif; }
</style>
