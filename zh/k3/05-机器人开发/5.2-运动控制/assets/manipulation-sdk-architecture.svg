<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="746" viewBox="0 0 1320 746" role="img" aria-labelledby="title desc">
  <title id="title">manipulation 组件架构</title>
  <desc id="desc">命令行、YAML 点位任务和 Python 接口经本地进程 manipulation-device 调用设备会话 DeviceSession，C++ 应用链接组件库直接调用设备会话。设备会话负责设备独占、动作执行、到位判定以及取消、超时和故障锁定，并调用按 device.driver 创建的 Nero、SO101、Mock 或扩展驱动。右侧配套能力提供运动学、手眼标定、设备配置与机器人模型以及 SO101 舵机工具。</desc>
