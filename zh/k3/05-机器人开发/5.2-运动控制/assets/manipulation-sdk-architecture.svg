  <!-- Generated by docs/diagrams/architecture.py; edit that source. -->
  <title id="title">manipulation 组件架构</title>
  <desc id="desc">命令行的交互控制和 Python 应用通过 DeviceClient，以本机 JSONL 调用 manipulation-device；任务与检查命令直接调用设备进程。C++ 控制程序在进程内使用 DeviceSession。runtime 解析配置、装配角色并调度 steps，设备会话统一控制 Arm 与可选 EndEffector，驱动分别对接真机、Mock 接口模拟和 UR5e / Robotiq 2F-85 MuJoCo 物理仿真。MuJoCo 角色可本地访问世界，也可经 TCP 连接常驻仿真服务。组件内 World 提供只读快照，Viewer 和 Renderer 输出窗口及 RGB-D；模拟相机客户端通过 TCP 观察连接获取图像。公共运动学、手眼标定及配置与模型作为配套模块。</desc>
